[tools]
yarn = "1.22.19"
node = "24"
python = "3.13"
uv = "0.6.14"

[env]
AWS_REGION = "ap-southeast-2"
BUILD_NUMBER = "{{ get_env(name='BUILD_NUMBER', default='') }}"

[tasks.cfn-lint]
description = "Lint ci/ CloudFormation templates with cfn-lint"
run = """
#!/usr/bin/env bash
set -euo pipefail
echo "==> cfn-lint: ci/ CloudFormation templates"
uv tool run --from cfn-lint==1.59.0 cfn-lint --config-file .cfnlintrc.yaml
"""

[tasks.checkov]
description = "Scan ci/ CloudFormation templates with Checkov"
run = """
#!/usr/bin/env bash
set -euo pipefail
echo "==> checkov: ci/ CloudFormation templates"
uv tool run --from checkov==3.4.0 checkov \
  --config-file .checkov.yml
"""

[tasks.test-modules]
description = "Run module unit tests"
run = """
#!/usr/bin/env bash
set -euo pipefail
# web-assets/app done-item test asserts Melbourne-local time formatting
export TZ=Australia/Melbourne
node --test ci-build.test.cjs
for dir in modules/*; do
  if [ -f "$dir/package.json" ]; then
    echo "==> test_module: $dir"
    yarn --cwd "$dir" test_module
  fi
done
"""

[tasks.test-infra]
description = "Run default infra gate checks"
depends = ["cfn-lint", "checkov"]

[tasks.gate]
description = "Run default local gate checks"
depends = ["test-infra", "test-modules"]
