name: ryu1kn/whatsdone
on:
  push:
    branches:
    - "**/*"
  pull_request:
  workflow_dispatch:

concurrency:
#   # This item has no matching transformer
#   maximum_number_of_builds: 1
  group: "${{ github.ref }}"
  cancel-in-progress: true

env:
  AWS_PROFILE: ci-whatsdone
  AWS_REGION: ap-southeast-2
  COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
  BUILD_COMMIT_RANGE: ${{ github.event.before }}...${{ github.event.after }}
  BUILD_NUMBER: ${{ github.run_number }}-${{ github.run_id }}
  BUILD_BRANCH: ${{ github.ref_name }}
  NODE_VERSION: 24
  FETCH_DEPTH: 30

jobs:
  pr-check:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v3.6.0
    - uses: jdx/mise-action@v2
    - name: Lint CloudFormation templates (cfn-lint)
      run: mise run cfn-lint
    - name: Check CloudFormation templates (Checkov)
      run: mise run checkov
    - name: Run unit tests
      run: mise run gate-tests

  oidc-test-ci:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main-new' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment:
      name: CI
      url: https://whatsdone.ryuichi.io
    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6.1.1
      with:
        role-to-assume: ${{ vars.AWS_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
        aws-profile: ci-whatsdone
        output-env-credentials: true
        mask-aws-account-id: true
    - name: Verify CI OIDC connection
      run: |
        set -euo pipefail
        aws sts get-caller-identity
        caller_arn="$(aws sts get-caller-identity --query Arn --output text)"
        echo "Assumed identity: ${caller_arn}"
        echo "${caller_arn}" | grep -q 'whatsdone-github-ci'

  ci-deploy:
    if: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment:
      name: CI
      url: https://whatsdone-ci.ryuichi.io
    steps:
    - name: checkout
      uses: actions/checkout@v3.6.0
      with:
        fetch-depth: ${{ env.FETCH_DEPTH }}
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6.1.1
      with:
        role-to-assume: ${{ vars.AWS_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
        aws-profile: ci-whatsdone
        output-env-credentials: true
        mask-aws-account-id: true
    - uses: actions/setup-node@v3.8.1
      with:
        cache: npm
        node-version: ${{ env.NODE_VERSION }}
    - run: ./ci-build.sh
      env:
        ENV_NAME: ci

  ci-e2e-test:
    if: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
    needs: [ci-deploy]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment:
      name: CI
      url: https://whatsdone-ci.ryuichi.io
    steps:
      - name: checkout
        uses: actions/checkout@v3.6.0
        with:
          fetch-depth: ${{ env.FETCH_DEPTH }}
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          aws-profile: ci-whatsdone
          output-env-credentials: true
          mask-aws-account-id: true
      - uses: actions/setup-node@v3.8.1
        with:
          cache: npm
          node-version: ${{ env.NODE_VERSION }}
      - run: make test
        working-directory: test/e2e
        env:
          ENV_NAME: ci

  production-deploy:
    if: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
    needs: [ci-e2e-test]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment:
      name: Production
      url: https://whatsdone.ryuichi.io
    steps:
      - name: checkout
        uses: actions/checkout@v3.6.0
        with:
          fetch-depth: ${{ env.FETCH_DEPTH }}
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          aws-profile: ci-whatsdone
          output-env-credentials: true
          mask-aws-account-id: true
      - uses: actions/setup-node@v3.8.1
        with:
          cache: npm
          node-version: ${{ env.NODE_VERSION }}
      - run: ./ci-build.sh
        env:
          ENV_NAME: prod
