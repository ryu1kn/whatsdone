# Dependabot configuration.
#
# Until this file existed, Dependabot ran on auto-detected manifests. The
# entries below mirror that status quo (every directory where dependabot has
# historically opened bumps).
#
# When adding a new module with a package.json / pyproject.toml, please add a
# matching entry here.

version: 2
updates:
  # ---- npm (Node.js) ----
  - package-ecosystem: npm
    directory: /modules/backend
    schedule:
      interval: daily

  - package-ecosystem: npm
    directory: /modules/backend/ops
    schedule:
      interval: daily

  - package-ecosystem: npm
    directory: /modules/web-assets
    schedule:
      interval: daily

  - package-ecosystem: npm
    directory: /modules/web-assets/app
    schedule:
      interval: daily

  - package-ecosystem: npm
    directory: /test/e2e
    schedule:
      interval: weekly

  # ---- pip (Python) ----
  - package-ecosystem: pip
    directory: /ml
    schedule:
      interval: weekly
    groups:
      ml-dependencies:
        patterns:
          - "*"
      ml-security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /tools/done-analysis
    schedule:
      interval: weekly
    groups:
      done-analysis-dependencies:
        patterns:
          - "*"
      done-analysis-security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /tools/topic-classification
    schedule:
      interval: weekly
    groups:
      topic-classification-dependencies:
        patterns:
          - "*"
      topic-classification-security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /tools/topic-classification/ops
    schedule:
      interval: weekly
    groups:
      topic-classification-ops-dependencies:
        patterns:
          - "*"
      topic-classification-ops-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
