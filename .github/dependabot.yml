# Dependabot configuration.
#
# Until this file existed, Dependabot ran on auto-detected manifests. The
# entries below mirror that status quo (every directory where dependabot has
# historically opened bumps).
#
# When adding a new module with a package.json / pyproject.toml, please add a
# matching entry here.

version: 2
updates:
  # ---- npm (Node.js) ----
  - package-ecosystem: npm
    directory: /modules/backend
    schedule:
      interval: daily

  - package-ecosystem: npm
    directory: /modules/backend/ops
    schedule:
      interval: daily

  - package-ecosystem: npm
    directory: /modules/web-assets
    schedule:
      interval: daily

  - package-ecosystem: npm
    directory: /modules/web-assets/app
    schedule:
      interval: daily

  - package-ecosystem: npm
    directory: /test/e2e
    schedule:
      interval: weekly

  # ---- pip (Python) ----
  - package-ecosystem: pip
    directory: /ml
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: /tools/done-analysis
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: /tools/topic-classification
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: /tools/topic-classification/ops
    schedule:
      interval: weekly
