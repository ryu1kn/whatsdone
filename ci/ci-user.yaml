AWSTemplateFormatVersion: "2010-09-09"
Description: What's Done CI group/user
Parameters:
  CiUserName:
    Description: User name for CI
    Type: String
  ReadOnlyUserPoolArn:
    Description: User pool ARN for CI read access
    Type: String
  ReadOnlyIdentityPoolArns:
    Description: Comma-separated identity pool ARNs for CI read access
    Type: CommaDelimitedList
Resources:
  CiUser:
    Type: "AWS::IAM::User"
    Properties:
      Groups:
        - !Ref WhatsDoneCiGroup
      Path: "/"
      UserName: !Ref CiUserName
  WhatsDoneCiReadOnlyPolicy:
    Type: "AWS::IAM::ManagedPolicy"
    Properties:
      Description: Read-only resource inspection for CI
      Users:
        - !Ref CiUser
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ReadStacks
            Effect: Allow
            Action:
              - cloudformation:GetTemplate
              - cloudformation:ListStackResources
            Resource:
              - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/whatsdone-artifacts/*'
              - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/dev-ryuichi-whatsdone-env-module/*'
              - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/whatsdone-dev-ryuichi-user-id-store/*'
              - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/dev-ryuichi-done-store/*'
              - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/whatsdone-dev-ryuichi-authentication/*'
              - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/dev-ryuichi-whatsdone-assets-module/*'
              - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/dev-ryuichi-whatsdone-web-cache-module/*'
              - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/dev-ryuichi-whatsdone-api/*'
              - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/dev-ryuichi-whatsdone-gateway-module/*'
          - Sid: ReadDynamoTables
            Effect: Allow
            Action:
              - dynamodb:Scan
            Resource:
              - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/whatsdone-dev-ryuichi-dones'
              - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/whatsdone-dev-ryuichi-user-ids'
          - Sid: ReadDevLambdaLogs
            Effect: Allow
            Action:
              - logs:FilterLogEvents
              - logs:GetLogEvents
            Resource:
              - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/whatsdone-dev-ryuichi-ProxyLambdaFunction'
              - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/whatsdone-dev-ryuichi-ProxyLambdaFunction:log-stream:*'
          - Sid: ReadUserPool
            Effect: Allow
            Action:
              - cognito-idp:DescribeUserPool
              - cognito-idp:DescribeUserPoolClient
              - cognito-idp:ListUsers
              - cognito-idp:AdminGetUser
            Resource: !Ref ReadOnlyUserPoolArn
          - Sid: ReadGitHubProvider
            Effect: Allow
            Action:
              - iam:GetOpenIDConnectProvider
            Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
          - Sid: ListIamResources
            Effect: Allow
            Action:
              - iam:ListOpenIDConnectProviders
              - iam:ListRoles
            Resource: "*"
          - Sid: ReadSecretMetadata
            Effect: Allow
            Action:
              - secretsmanager:DescribeSecret
            Resource:
              - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/whatsdone/ci/e2e-test-*'
              - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/whatsdone/dev-ryuichi/e2e-test-*'
          - Sid: ReadIdentityPools
            Effect: Allow
            Action:
              - cognito-identity:DescribeIdentityPool
            Resource: !Ref ReadOnlyIdentityPoolArns
  WhatsDoneCiGroup:
    Type: "AWS::IAM::Group"
    Properties:
      GroupName: whatsdone-ci
      Path: "/"
      Policies:
        - PolicyName: whatsdone-ci-20170716
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Stmt1489901204000
                Effect: Allow
                Action:
                  - acm:DescribeCertificate
                  - acm:GetCertificate
                  - acm:ListCertificates
                  - acm:ListTagsForCertificate
                  - apigateway:DELETE
                  - apigateway:GET
                  - apigateway:HEAD
                  - apigateway:OPTIONS
                  - apigateway:PATCH
                  - apigateway:POST
                  - apigateway:PUT
                  - cloudformation:CreateChangeSet
                  - cloudformation:CreateStack
                  - cloudformation:DeleteStack
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:GetTemplateSummary
                  - cloudformation:UpdateStack
                  - cloudformation:UpdateTerminationProtection
                  - cloudfront:CreateCloudFrontOriginAccessIdentity
                  - cloudfront:CreateDistribution
                  - cloudfront:DeleteDistribution
                  - cloudfront:GetDistribution
                  - cloudfront:GetDistributionConfig
                  - cloudfront:UpdateDistribution
                  - cognito-idp:CreateUserPoolDomain
                  - cognito-idp:DescribeUserPoolDomain
                  - cognito-idp:UpdateUserPoolClient
                  - dynamodb:CreateTable
                  - dynamodb:DeleteTable
                  - dynamodb:DescribeTable
                  - dynamodb:UpdateTable
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:DeleteRolePolicy
                  - iam:PassRole
                  - iam:PutRolePolicy
                  - kms:CreateGrant
                  - kms:Encrypt
                  - kms:Decrypt
                  - lambda:AddPermission
                  - lambda:CreateFunction
                  - lambda:DeleteFunction
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:RemovePermission
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:DeleteLogGroup
                  - logs:DeleteLogStream
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                  - logs:PutLogEvents
                  - logs:PutRetentionPolicy
                  - route53:ChangeResourceRecordSets
                  - route53:GetChange
                  - route53:GetHostedZone
                  - s3:*
                Resource: "*"
              - Sid: Stmt1489901204001
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/whatsdone/ci/*'
              - Sid: Stmt03
                Effect: Allow
                Action:
                  - comprehend:CreateEndpoint
                  - comprehend:DeleteEndpoint
                  - comprehend:DescribeEndpoint
                  - comprehend:UpdateEndpoint
                Resource:
                  - !Sub 'arn:aws:comprehend:${AWS::Region}:${AWS::AccountId}:document-classifier-endpoint/whatsdone-*-topic-classifier'
                  - !Sub 'arn:aws:comprehend:${AWS::Region}:${AWS::AccountId}:document-classifier/whatsdone-topic-classifier'
                  - !Sub 'arn:aws:comprehend:${AWS::Region}:${AWS::AccountId}:document-classifier/whatsdone-topic-classifier/version/*'
              - Sid: Stmt04
                Effect: Allow
                Action:
                  - comprehend:ListEndpoints
                Resource:
                  - '*'
