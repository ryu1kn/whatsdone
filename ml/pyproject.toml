[project]
name = "whatsdone-ml"
version = "0.1.0"
description = "ML infrastructure for What's Done topic classification"
requires-python = ">=3.13"
dependencies = [
    "metaflow>=2.19.40",
    "mlflow>=3.17.2",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.2.0",
    "pandas>=3.1.0",
    "numpy>=2.5.4",
    "boto3>=1.43.123",
    "joblib>=1.6.0",
    "hdbscan>=0.8.44",
    "plotly>=7.1.0",
    "jupyter>=1.1.1",
    "notebook>=7.6.4",
    "psycopg2-binary>=2.9.13",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "pydantic>=2.14.2"
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "black>=26.10.1",
    "flake8>=7.5.0",
    "mypy>=2.4.1"
]
